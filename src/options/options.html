<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram Media Downloader — Settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="options" role="main">
      <h1 class="options__title" data-i18n="options_title">Settings</h1>

      <form id="settings-form" class="options__form">
        <label class="field field--switch">
          <span class="field__label">
            <span data-i18n="options_auto_scan">Automatic scanning</span>
            <small class="field__hint" data-i18n="options_auto_scan_desc">
              Continuously detect new media as you scroll.
            </small>
          </span>
          <input type="checkbox" id="autoScan" name="autoScan" />
        </label>

        <label class="field">
          <span class="field__label" data-i18n="options_theme">Theme</span>
          <select id="theme" name="theme">
            <option value="auto" data-i18n="options_theme_auto">Adapt to Telegram</option>
            <option value="light" data-i18n="options_theme_light">Light</option>
            <option value="dark" data-i18n="options_theme_dark">Dark</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="options_language">Language</span>
          <select id="language" name="language">
            <option value="en" data-i18n="options_language_en">English</option>
            <option value="tr" data-i18n="options_language_tr">Türkçe</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="options_log_level">Logging level</span>
          <select id="logLevel" name="logLevel">
            <option value="debug">debug</option>
            <option value="info">info</option>
            <option value="warn">warn</option>
            <option value="error">error</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="options_queue_size"
            >Max concurrent downloads</span
          >
          <input
            type="number"
            id="maxConcurrentDownloads"
            name="maxConcurrentDownloads"
            min="1"
            max="10"
          />
        </label>

        <label class="field">
          <span class="field__label" data-i18n="options_max_retries">Max retries</span>
          <input type="number" id="maxRetries" name="maxRetries" min="0" max="10" />
        </label>

        <label class="field">
          <span class="field__label">
            <span data-i18n="options_download_delay"></span>
            <small
              class="field__hint"
              id="downloadDelayMs-hint"
              data-i18n="options_download_delay_desc"
            ></small>
          </span>
          <input
            type="number"
            id="downloadDelayMs"
            name="downloadDelayMs"
            min="0"
            max="60000"
            step="1"
            aria-describedby="downloadDelayMs-hint"
          />
        </label>

        <label class="field">
          <span class="field__label">
            <span data-i18n="options_download_jitter"></span>
            <small
              class="field__hint"
              id="downloadJitterMs-hint"
              data-i18n="options_download_jitter_desc"
            ></small>
          </span>
          <input
            type="number"
            id="downloadJitterMs"
            name="downloadJitterMs"
            min="0"
            max="60000"
            step="1"
            aria-describedby="downloadJitterMs-hint"
          />
        </label>

        <div class="field">
          <label class="field__label" for="fileNameTemplate">
            <span data-i18n="options_file_name_template"></span>
            <small
              class="field__hint"
              data-i18n="options_file_name_template_desc"
            ></small>
          </label>
          <input
            type="text"
            id="fileNameTemplate"
            name="fileNameTemplate"
            spellcheck="false"
            autocomplete="off"
            aria-describedby="templateInvalid templatePreviewBlock templateTokens"
          />
          <p id="templateInvalid" class="field__error" role="alert" hidden></p>
          <p id="templatePreviewBlock" class="field__preview">
            <span data-i18n="options_template_preview"></span>:
            <output id="templatePreview" for="fileNameTemplate"></output>
          </p>
          <details id="templateTokens" class="field__tokens">
            <summary data-i18n="options_template_tokens"></summary>
            <ul>
              <li><code>{chat}</code> <span data-i18n="options_token_chat"></span></li>
              <li><code>{peer}</code> <span data-i18n="options_token_peer"></span></li>
              <li><code>{date}</code> <span data-i18n="options_token_date"></span></li>
              <li><code>{time}</code> <span data-i18n="options_token_time"></span></li>
              <li><code>{msgId}</code> <span data-i18n="options_token_msgId"></span></li>
              <li><code>{index}</code> <span data-i18n="options_token_index"></span></li>
              <li><code>{type}</code> <span data-i18n="options_token_type"></span></li>
              <li><code>{name}</code> <span data-i18n="options_token_name"></span></li>
              <li><code>{ext}</code> <span data-i18n="options_token_ext"></span></li>
            </ul>
          </details>
        </div>

        <label class="field field--switch">
          <span class="field__label">
            <span data-i18n="options_prefer_native"></span>
            <small class="field__hint" data-i18n="options_prefer_native_desc"></small>
          </span>
          <input type="checkbox" id="preferNativeDownload" name="preferNativeDownload" />
        </label>

        <label class="field">
          <span class="field__label">
            <span data-i18n="options_large_file_threshold"></span>
            <small
              class="field__hint"
              id="largeFileThresholdMb-hint"
              data-i18n="options_large_file_threshold_desc"
            ></small>
          </span>
          <input
            type="number"
            id="largeFileThresholdMb"
            name="largeFileThresholdMb"
            min="1"
            max="4096"
            step="1"
            aria-describedby="largeFileThresholdMb-hint"
          />
        </label>

        <label class="field field--switch">
          <span class="field__label">
            <span data-i18n="options_skip_downloaded"></span>
            <small class="field__hint" data-i18n="options_skip_downloaded_desc"></small>
          </span>
          <input type="checkbox" id="skipDownloaded" name="skipDownloaded" />
        </label>

        <div class="options__actions">
          <button type="submit" class="btn btn--primary" data-i18n="options_save">
            Save
          </button>
          <button type="button" id="reset" class="btn" data-i18n="options_reset">
            Reset to defaults
          </button>
        </div>

        <p id="saved" class="options__saved" role="status" aria-live="polite" hidden></p>
      </form>
    </main>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
